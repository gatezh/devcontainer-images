name: Build claude-code

on:
  push:
    branches: [master]
    paths:
      - "claude-code/.devcontainer/Dockerfile"
      - "claude-code/.devcontainer/*.sh"
      - "claude-code/.devcontainer/managed-settings.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: build-claude-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-default:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      target: default
      context: claude-code/.devcontainer

      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/gatezh/devcontainers/claude-code
      meta-tags: |
        type=raw,value=latest
        type=sha,prefix=
        type=raw,value={{date 'YYYYMMDD'}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-sandbox:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      target: sandbox
      context: claude-code/.devcontainer

      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/gatezh/devcontainers/claude-code-sandbox
      meta-tags: |
        type=raw,value=latest
        type=sha,prefix=
        type=raw,value={{date 'YYYYMMDD'}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-happy:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      target: happy
      context: claude-code/.devcontainer

      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/gatezh/devcontainers/claude-code-happy
      meta-tags: |
        type=raw,value=latest
        type=sha,prefix=
        type=raw,value={{date 'YYYYMMDD'}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify ${{ matrix.image-suffix }} (${{ matrix.arch }})
    needs: [build-default, build-sandbox, build-happy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image-suffix: claude-code
            runner: ubuntu-24.04
            arch: amd64
          - image-suffix: claude-code
            runner: ubuntu-24.04-arm
            arch: arm64
          - image-suffix: claude-code-sandbox
            runner: ubuntu-24.04
            arch: amd64
          - image-suffix: claude-code-sandbox
            runner: ubuntu-24.04-arm
            arch: arm64
          - image-suffix: claude-code-happy
            runner: ubuntu-24.04
            arch: amd64
          - image-suffix: claude-code-happy
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The command comes from .github/verify-commands.json, the same file
      # ci.yml reads, so pull-request and post-publish checks cannot drift.
      # Reading it into a shell variable also keeps the command out of the
      # `run:` script that Actions expands, so nothing from the workflow
      # context is interpolated into shell.
      - name: Verify image
        env:
          IMAGE: ${{ matrix.image-suffix }}
        run: |
          VERIFY=$(jq -er --arg k "$IMAGE" '.[$k]' .github/verify-commands.json) || {
            echo "::error::no verify command for '$IMAGE' in .github/verify-commands.json"
            exit 1
          }
          docker pull "ghcr.io/gatezh/devcontainers/${IMAGE}:latest"
          docker run --rm "ghcr.io/gatezh/devcontainers/${IMAGE}:latest" bash -c "$VERIFY"
